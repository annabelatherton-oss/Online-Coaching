<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200">
  <!-- Oval border -->
  <ellipse cx="150" cy="100" rx="142" ry="92" fill="#F2EAE0" stroke="#8B6534" stroke-width="1.8"/>

  <!-- Dumbbell icon -->
  <!-- Left outer plate -->
  <rect x="78" y="34" width="18" height="33" rx="3" fill="none" stroke="#8B6534" stroke-width="1.8"/>
  <!-- Left inner plate -->
  <rect x="83" y="40" width="9" height="21" rx="1.5" fill="none" stroke="#8B6534" stroke-width="1.3"/>
  <!-- Left collar -->
  <rect x="96" y="44" width="8" height="13" rx="1" fill="none" stroke="#8B6534" stroke-width="1.5"/>
  <!-- Bar -->
  <rect x="104" y="47" width="92" height="7" rx="2" fill="none" stroke="#8B6534" stroke-width="1.5"/>
  <!-- Right collar -->
  <rect x="196" y="44" width="8" height="13" rx="1" fill="none" stroke="#8B6534" stroke-width="1.5"/>
  <!-- Right inner plate -->
  <rect x="208" y="40" width="9" height="21" rx="1.5" fill="none" stroke="#8B6534" stroke-width="1.3"/>
  <!-- Right outer plate -->
  <rect x="204" y="34" width="18" height="33" rx="3" fill="none" stroke="#8B6534" stroke-width="1.8"/>

  <!-- AAPT -->
  <text x="150" y="120" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="bold" fill="#8B6534">AAPT</text>

  <!-- ANNABEL ATHERTON -->
  <text x="150" y="145" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" letter-spacing="2.5" fill="#8B6534">ANNABEL ATHERTON</text>

  <!-- PERSONAL TRAINING -->
  <text x="150" y="163" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" letter-spacing="2.5" fill="#8B6534">PERSONAL TRAINING</text>
</svg>
