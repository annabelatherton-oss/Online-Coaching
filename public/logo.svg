  <!-- ANNABEL ATHERTON -->
  <text x="150" y="140" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" letter-spacing="2.5" fill="#8B6534">ANNABEL ATHERTON</text>

  <!-- PERSONAL TRAINING -->
  <text x="150" y="157" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" letter-spacing="2.5" fill="#8B6534">PERSONAL TRAINING</text>
